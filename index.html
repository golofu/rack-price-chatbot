<title>แร็คไหน ราคาเท่าไหร่</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#EDF2F3; --surface:#FFFFFF; --surface-2:#F6FAFA; --raised:#FFFFFF;
  --ink:#111A1D; --ink-2:#47555A; --ink-3:#78878C;
  --line:#D9E3E5; --line-soft:#E9F0F1;
  --accent:#0E7C86; --accent-deep:#075A62; --accent-soft:#D2EDEF; --accent-ring:#0E7C8633;
  --oil:#96521A; --oil-soft:#F8E7D5; --oil-line:#EBCDAF;
  --eps:#544795; --eps-soft:#E6E2F7; --eps-line:#CFC7EE;
  --user-bg:#0E7C86; --user-ink:#F3FEFF; --on-accent:#FFFFFF;
  --shadow-1:0 1px 2px rgba(17,26,29,.05), 0 10px 26px -16px rgba(17,26,29,.28);
  --shadow-2:0 2px 4px rgba(17,26,29,.06), 0 18px 40px -22px rgba(17,26,29,.4);
  --r-lg:16px; --r-md:11px; --r-sm:7px;
  --pill:999px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0C1214; --surface:#151F22; --surface-2:#1A262A; --raised:#1D2A2E;
    --ink:#E6EFF0; --ink-2:#A6B5B9; --ink-3:#78888D;
    --line:#26353A; --line-soft:#1E2C30;
    --accent:#4FC5CE; --accent-deep:#8AE0E7; --accent-soft:#0F3A3F; --accent-ring:#4FC5CE44;
    --oil:#E3A268; --oil-soft:#33240F; --oil-line:#4B3618;
    --eps:#B3A6F0; --eps-soft:#231D45; --eps-line:#352C63;
    --user-bg:#17636B; --user-ink:#EAFDFF; --on-accent:#06262A;
    --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.7);
    --shadow-2:0 2px 4px rgba(0,0,0,.45), 0 18px 40px -22px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0C1214; --surface:#151F22; --surface-2:#1A262A; --raised:#1D2A2E;
  --ink:#E6EFF0; --ink-2:#A6B5B9; --ink-3:#78888D;
  --line:#26353A; --line-soft:#1E2C30;
  --accent:#4FC5CE; --accent-deep:#8AE0E7; --accent-soft:#0F3A3F; --accent-ring:#4FC5CE44;
  --oil:#E3A268; --oil-soft:#33240F; --oil-line:#4B3618;
  --eps:#B3A6F0; --eps-soft:#231D45; --eps-line:#352C63;
  --user-bg:#17636B; --user-ink:#EAFDFF;
  --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.7);
  --shadow-2:0 2px 4px rgba(0,0,0,.45), 0 18px 40px -22px rgba(0,0,0,.8);
}

:root[data-theme="light"]{--on-accent:#FFFFFF}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Sarabun","Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit; color:inherit}

.app{display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden}

/* ---------- header ---------- */
.topbar{
  flex:0 0 auto; display:flex; align-items:center; gap:13px;
  padding:11px clamp(14px,4vw,30px);
  background:var(--surface); border-bottom:1px solid var(--line);
}
.mark{
  width:38px; height:38px; border-radius:11px; flex:0 0 auto;
  object-fit:cover; box-shadow:0 0 0 1px var(--line);
}
.brandwrap{display:flex; flex-direction:column; min-width:0; gap:1px}
.brand{
  font-family:"Kanit",sans-serif; font-weight:600; font-size:10.5px;
  letter-spacing:.16em; text-transform:uppercase; color:var(--accent);
}
.apptitle{
  font-family:"Kanit",sans-serif; font-weight:500; font-size:16.5px;
  line-height:1.2; letter-spacing:-.005em; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis;
}
.topmeta{margin-left:auto; display:flex; align-items:center; gap:9px}
.stat{
  font-family:"Kanit",sans-serif; font-size:11.5px; font-weight:400;
  color:var(--ink-3); white-space:nowrap;
}
.stat b{color:var(--ink-2); font-weight:600; font-variant-numeric:tabular-nums}
.iconbtn{
  width:34px; height:34px; border-radius:9px; border:1px solid var(--line);
  background:var(--surface-2); cursor:pointer; display:grid; place-items:center;
  color:var(--ink-2); transition:background .15s, color .15s;
}
.iconbtn:hover{background:var(--accent-soft); color:var(--accent-deep)}
.iconbtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- chat scroll ---------- */
.scroll{flex:1 1 auto; overflow-y:auto; overflow-x:hidden; scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){.scroll{scroll-behavior:auto}}
.thread{
  max-width:820px; margin:0 auto;
  padding:22px clamp(14px,4vw,30px) 8px;
  display:flex; flex-direction:column; gap:18px;
}

.row{display:flex; gap:10px; align-items:flex-start}
.row.me{justify-content:flex-end}
.avatar{
  width:30px; height:30px; border-radius:9px; flex:0 0 auto; margin-top:2px;
  object-fit:cover; box-shadow:0 0 0 1px var(--line);
}
.bubble{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-lg); border-top-left-radius:5px;
  padding:13px 16px; box-shadow:var(--shadow-1); max-width:min(100%,700px);
}
.row.me .bubble{
  background:var(--user-bg); color:var(--user-ink); border-color:transparent;
  border-radius:var(--r-lg); border-top-right-radius:5px; border-top-left-radius:var(--r-lg);
  max-width:min(88%,540px);
}
.headline{margin:0; font-size:15px; line-height:1.6}
.headline b{font-weight:600; color:var(--accent-deep)}
.row.me .headline b{color:inherit}

/* ---------- welcome ---------- */
.welcome{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:20px 20px 18px; box-shadow:var(--shadow-1);
}
.welcome h1{
  font-family:"Kanit",sans-serif; font-weight:600; font-size:21px; margin:0 0 6px;
  letter-spacing:-.01em; text-wrap:balance;
}
.welcome p{margin:0 0 15px; color:var(--ink-2); font-size:14.5px; max-width:60ch}
.kbd{
  font-family:"Kanit",sans-serif; font-size:11px; padding:1px 6px; border-radius:5px;
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2);
}
.exlabel{
  font-family:"Kanit",sans-serif; font-size:10.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 9px;
}
.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{
  font-family:"Kanit",sans-serif; font-weight:400; font-size:13px;
  padding:6px 13px; border-radius:var(--pill); cursor:pointer;
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2);
  transition:border-color .15s, color .15s, background .15s;
}
.chip:hover{border-color:var(--accent); color:var(--accent-deep); background:var(--accent-soft)}
.chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- answer cards ---------- */
.cards{display:flex; flex-direction:column; gap:10px; margin-top:13px}
.card{
  border:1px solid var(--line); border-radius:var(--r-md); background:var(--surface-2);
  overflow:hidden;
}
.card-top{
  display:flex; align-items:center; gap:11px; flex-wrap:wrap;
  padding:10px 13px; border-bottom:1px solid var(--line-soft);
}
.code{
  font-family:"Kanit",sans-serif; font-weight:600; font-size:14px; letter-spacing:.06em;
  color:var(--accent-deep); background:var(--accent-soft);
  padding:3px 10px; border-radius:var(--r-sm);
}
.price{
  margin-left:auto; font-family:"Kanit",sans-serif; font-weight:600; font-size:20px;
  letter-spacing:-.015em; font-variant-numeric:tabular-nums; color:var(--ink);
}
.price span{font-size:11.5px; font-weight:400; color:var(--ink-3); margin-left:4px}
.tag{
  font-family:"Kanit",sans-serif; font-size:11.5px; font-weight:400;
  padding:2.5px 10px; border-radius:var(--pill); border:1px solid;
}
.tag.oil{color:var(--oil); background:var(--oil-soft); border-color:var(--oil-line)}
.tag.eps{color:var(--eps); background:var(--eps-soft); border-color:var(--eps-line)}
.tag.lhd{color:var(--ink-2); background:transparent; border-color:var(--line); border-style:dashed}

.fitcap{
  font-family:"Kanit",sans-serif; font-size:10.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3);
  padding:8px 13px 0; margin:0;
}
.fits{list-style:none; margin:0; padding:4px 0}
.fits li.hit{box-shadow:inset 3px 0 0 var(--accent)}
.fits li.hit .m{color:var(--accent-deep)}
.fits li{
  display:flex; gap:10px; align-items:baseline; flex-wrap:wrap;
  padding:5.5px 13px; border-top:1px solid var(--line-soft);
}
.fits li:first-child{border-top:0}
.fits .m{font-weight:600; font-size:14px}
.fits .b{
  font-family:"Kanit",sans-serif; font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3);
}
.fits .y{font-size:13px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.fits .e{font-size:12.5px; color:var(--ink-3); margin-left:auto}

/* ---------- result table ---------- */
.tablewrap{margin-top:12px; border:1px solid var(--line); border-radius:var(--r-md); overflow-x:auto}
table{border-collapse:separate; border-spacing:0; width:100%; min-width:620px; font-size:13.5px}
th,td{padding:7px 11px; text-align:left; border-bottom:1px solid var(--line-soft); white-space:nowrap}
th{
  font-family:"Kanit",sans-serif; font-weight:500; font-size:11px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--ink-3); background:var(--surface-2);
  position:sticky; top:0;
}
tbody tr:last-child td{border-bottom:0}
td.num{text-align:right; font-variant-numeric:tabular-nums; font-weight:600}
/* ราคาเป็นคำตอบหลัก ตรึงไว้ขอบขวาเสมอแม้เลื่อนตารางไปทางไหน */
th:last-child, td:last-child{
  position:sticky; right:0; border-left:1px solid var(--line);
  box-shadow:-8px 0 10px -10px rgba(0,0,0,.35);
}
th:last-child{z-index:2; background:var(--surface-2)}
td:last-child{background:var(--surface)}
td.code-cell{font-family:"Kanit",sans-serif; font-weight:500; letter-spacing:.05em; color:var(--accent-deep)}

.foot{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  margin-top:12px; padding-top:11px; border-top:1px solid var(--line-soft);
}
.srcnote{font-size:12px; color:var(--ink-3)}
.linkbtn{
  font-family:"Kanit",sans-serif; font-size:12.5px; background:none; border:0;
  color:var(--accent); cursor:pointer; padding:3px 2px; border-radius:5px;
}
.linkbtn:hover{color:var(--accent-deep); text-decoration:underline}
.linkbtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.foot .linkbtn:last-of-type{margin-left:auto}

.hint{margin:11px 0 0; font-size:13.5px; color:var(--ink-2)}
.hint b{color:var(--ink); font-weight:600}

/* ---------- typing ---------- */
.dots{display:flex; gap:4px; padding:6px 2px}
.dots i{width:6px; height:6px; border-radius:50%; background:var(--ink-3); animation:blip 1.1s infinite}
.dots i:nth-child(2){animation-delay:.16s}
.dots i:nth-child(3){animation-delay:.32s}
@keyframes blip{0%,60%,100%{opacity:.25; transform:translateY(0)}30%{opacity:1; transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none; opacity:.5}}

/* ---------- composer ---------- */
.composer{
  flex:0 0 auto; background:var(--surface); border-top:1px solid var(--line);
  padding:11px clamp(14px,4vw,30px) 13px;
}
.composer-inner{max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:9px}
.quick{display:flex; flex-wrap:wrap; gap:7px}
.quick .chip{white-space:nowrap; font-size:12.5px; padding:5px 12px}
.inputrow{display:flex; gap:9px; align-items:flex-end}
textarea{
  flex:1 1 auto; resize:none; font-family:inherit; font-size:15px; line-height:1.5;
  padding:11px 14px; border-radius:13px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink); max-height:132px; min-height:44px;
  overflow-y:hidden;
}
textarea::placeholder{color:var(--ink-3)}
textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-ring)}
.send{
  flex:0 0 auto; height:44px; padding:0 20px; border-radius:13px; border:0; cursor:pointer;
  background:var(--accent); color:var(--on-accent);
  font-family:"Kanit",sans-serif; font-weight:500; font-size:14.5px;
  transition:background .15s, opacity .15s;
}
.send:hover{background:var(--accent-deep)}
.send:disabled{opacity:.4; cursor:default}
.send:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.disclaimer{
  font-size:11.5px; color:var(--ink-3); text-align:center; margin:0;
}

@media (max-width:560px){
  .apptitle{font-size:15px}
  .stat{display:none}
  .price{font-size:18px}
  .fits .e{margin-left:0; width:100%}
}
</style>

<div class="app">
  <header class="topbar">
    <img class="mark" id="mark" alt="โลโก้ Gen AI Space">
    <div class="brandwrap">
      <span class="brand">Gen AI Space</span>
      <span class="apptitle">ผู้ช่วยเช็คราคาแร็คพวงมาลัย</span>
    </div>
    <div class="topmeta">
      <span class="stat"><b id="statRows">0</b> รายการ · <b id="statCodes">0</b> รหัสแร็ค</span>
      <button class="iconbtn" id="themeBtn" type="button" title="สลับโหมดสว่าง/มืด" aria-label="สลับโหมดสว่าง/มืด">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"></path></svg>
      </button>
      <button class="iconbtn" id="resetBtn" type="button" title="เริ่มบทสนทนาใหม่" aria-label="เริ่มบทสนทนาใหม่">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
      </button>
    </div>
  </header>

  <main class="scroll" id="scroll">
    <div class="thread" id="thread" aria-live="polite"></div>
  </main>

  <div class="composer">
    <div class="composer-inner">
      <div class="quick" id="quick"></div>
      <div class="inputrow">
        <textarea id="input" rows="1" placeholder="พิมพ์รุ่นรถ รหัสแร็ค หรือคำถาม เช่น แร็ค vigo ราคาเท่าไหร่" aria-label="ช่องพิมพ์คำถาม"></textarea>
        <button class="send" id="send" type="button">ถาม</button>
      </div>
      <p class="disclaimer">ข้อมูลชุดทดลอง 200 รายการ ใช้สำหรับฝึกอบรม ไม่ใช่ราคาขายจริง — ยืนยันราคากับฝ่ายอะไหล่ก่อนแจ้งลูกค้าทุกครั้ง</p>
    </div>
  </div>
</div>

  'อะไร','บ้าง','มี','ไหน','แบบ','นะ','จะ','ให้','กับ','และ','หรือ','เอา','ดู','เช็ค','เช็ก','check'];

function norm(s){
  return String(s).toLowerCase()
    .replace(/[.,!?()"'‘’“”\/\\|+]/g,' ')
    .replace(/\s+/g,' ').trim();
}
function thb(n){return n.toLocaleString('en-US')}

/* ---------------- query parsing ---------------- */
function parse(qRaw){
  let q = norm(qRaw);
  const p = {raw:qRaw, brands:[], terms:[], unknown:[], code:null, year:null, type:null,
             lhd:false, cheap:false, exp:false, cap:null, count:false, listAll:false, engine:null};

  // รหัสแร็ค เช่น RT01 RTL20 rh 5
  const cm = q.match(/\b(rt|rh|rn|ri|rm|rz|rf|rc|rs|rg)\s?(l)?\s?0?(\d{1,2})\b/i);
  if(cm){
    const pre = cm[1].toUpperCase() + (cm[2] ? 'L' : '');
    p.code = pre + String(cm[3]).padStart(2,'0');
    q = q.replace(cm[0],' ');
  }

  // ปี
  const ym = q.match(/\b(19[89]\d|20[0-2]\d)\b/);
  if(ym){ p.year = parseInt(ym[1],10); q = q.replace(ym[0],' '); }

  // งบ / ไม่เกิน
  const capm = q.match(/(?:ไม่เกิน|ต่ำกว่า|ภายใน|งบ|under|max)\s*([\d,]{3,6})/);
  if(capm){ p.cap = parseInt(capm[1].replace(/,/g,''),10); q = q.replace(capm[0],' '); }

  if(/ถูกสุด|ถูกที่สุด|ต่ำสุด|ราคาต่ำ|cheap/.test(q)) p.cheap = true;
  if(/แพงสุด|แพงที่สุด|สูงสุด|ราคาสูง|expensive/.test(q)) p.exp = true;
  if(/กี่รายการ|กี่ตัว|กี่รุ่น|กี่รหัส|จำนวน|how many/.test(q)) p.count = true;
  if(/ทั้งหมด|มีอะไรบ้าง|มีรุ่นไหน|ลิสต์|list|all/.test(q)) p.listAll = true;
  if(/ไฟฟ้า|กระบอกแห้ง|eps|electric/.test(q)) p.type = 1;
  else if(/น้ำมัน|ไฮดรอ|hydraulic|power\s?steer/.test(q)) p.type = 0;
  if(/พวงมาลัยซ้าย|พวงซ้าย|มือซ้าย|lhd/.test(q)) p.lhd = true;

  // ยี่ห้อ
  Object.keys(BRAND_ALIAS).forEach(function(b){
    BRAND_ALIAS[b].slice().sort(function(x,y){return y.length-x.length}).forEach(function(a){
      if(p.brands.indexOf(b) < 0 && q.indexOf(a) >= 0){ p.brands.push(b); q = q.split(a).join(' '); }
    });
  });

  // ชื่อรุ่นภาษาไทย -> อังกฤษ
  Object.keys(MODEL_ALIAS).sort(function(x,y){return y.length-x.length}).forEach(function(th){
    if(q.indexOf(th) >= 0){ p.terms.push(MODEL_ALIAS[th]); q = q.split(th).join(' '); }
  });

  // รหัสเครื่องยนต์ เช่น 2kd 1nz 4jj1 (ยกเว้น 2wd/4wd ซึ่งเป็นชื่อรุ่น)
  const em = q.match(/\b(\d[a-z]{1,3}\d?[a-z]?(?:-[a-z]{1,4})?)\b/i);
  if(em && /[a-z]/i.test(em[1]) && !/^\d(wd|x[24])$/i.test(em[1])){
    p.engine = em[1]; q = q.replace(em[0],' ');
  }

  // ตัดคำฟุ่มเฟือยแบบ substring เพราะภาษาไทยไม่เว้นวรรค
  STOP.slice().sort(function(x,y){return y.length-x.length}).forEach(function(w){
    if(q.indexOf(w) >= 0) q = q.split(w).join(' ');
  });

  // คำที่เหลือ: เก็บเฉพาะที่มีอังกฤษ/ตัวเลข ส่วนไทยล้วนถือเป็นคำที่ยังไม่รู้จัก
  norm(q).split(' ').forEach(function(t){
    if(!t || t.length < 2) return;
    if(/[a-z0-9]/.test(t)){
      if(p.terms.indexOf(t) < 0) p.terms.push(t);
    } else if(t.length >= 3){
      p.unknown.push(t);
    }
  });
  return p;
}
function hasConstraint(p){
  return !!(p.code || p.brands.length || p.terms.length || p.engine ||
            p.type !== null || p.year !== null || p.cap !== null ||
            p.cheap || p.exp || p.count || p.listAll || p.lhd);
}

/* ---------------- search ---------------- */
function search(p){
  let rows = ROWS.slice();
  if(p.code) rows = rows.filter(function(r){return r.code === p.code});
  if(p.brands.length) rows = rows.filter(function(r){return p.brands.indexOf(r.brand) >= 0});
  if(p.type !== null) rows = rows.filter(function(r){return r.typeIdx === p.type});
  if(p.lhd) rows = rows.filter(function(r){return r.lhd});
  if(p.cap !== null) rows = rows.filter(function(r){return r.price <= p.cap});
  if(p.year !== null) rows = rows.filter(function(r){
    const yy = r.year.split('-'); return p.year >= +yy[0] && p.year <= +yy[1];
  });
  if(p.engine) rows = rows.filter(function(r){
    return r.engine.toLowerCase().replace(/[-\s]/g,'').indexOf(p.engine.toLowerCase().replace(/[-\s]/g,'')) >= 0;
  });
  if(p.terms.length){
    const scored = rows.map(function(r){
      let s = 0, hits = 0;
      p.terms.forEach(function(t){
        if(r.hay.indexOf(t) >= 0){ s += t.length >= 4 ? 3 : 2; hits++; }
        else if(t.length >= 4 && near(r.hay, t)){ s += 1; hits++; }
      });
      return {r:r, s:s, hits:hits};
    }).filter(function(x){return x.hits > 0});
    // ต้องตรงทุกคำก่อน เช่น "ดีแม็ก 4wd" ต้องได้เฉพาะ D-MAX 4WD
    const all = scored.filter(function(x){return x.hits === p.terms.length});
    const use = all.length ? all : scored;
    use.sort(function(a,b){return b.s - a.s});
    rows = use.map(function(x){return x.r});
  }
  if(p.cheap) rows.sort(function(a,b){return a.price - b.price});
  if(p.exp) rows.sort(function(a,b){return b.price - a.price});
  return rows;
}
// เผื่อพิมพ์ผิด 1 ตัวอักษร
function near(hay, t){
  for(let i = 0; i <= hay.length - t.length; i++){
    let miss = 0;
    for(let j = 0; j < t.length; j++){ if(hay[i+j] !== t[j] && ++miss > 1) break; }
    if(miss <= 1) return true;
  }
  return false;
}
function groupCodes(rows){
  const seen = new Set(); const out = [];
  rows.forEach(function(r){
    const k = r.brand+'|'+r.code;
    if(seen.has(k)) return;
    seen.add(k); out.push(CODE_OF.get(k));
  });
  return out;
}

/* ---------------- answer building ---------------- */
function answer(qRaw){
  const q = norm(qRaw);
  if(!q) return {headline:'พิมพ์ชื่อรุ่นรถหรือรหัสแร็คมาได้เลยครับ'};
  if(/^(สวัสดี|หวัดดี|ดีครับ|ดีค่ะ|hello|hi|hey)/.test(q))
    return {headline:'สวัสดีครับ ผมช่วยเช็ค<b>ราคาแร็คพวงมาลัย</b>ให้ได้ พิมพ์ชื่อรุ่นรถ ปี หรือรหัสแร็คมาได้เลย', chipsAfter:true};
  if(/ขอบคุณ|ขอบใจ|thank/.test(q))
    return {headline:'ยินดีครับ มีรุ่นไหนอีกถามได้ตลอด'};
  if(/ช่วยอะไร|ทำอะไรได้|วิธีใช้|help|ใช้ยังไง/.test(q))
    return {headline:'ถามได้ 5 แบบครับ', hint:
      '<b>1.</b> ชื่อรุ่น — “แร็ค vigo ราคาเท่าไหร่”<br>'+
      '<b>2.</b> รุ่น + ปี — “altis 2010”<br>'+
      '<b>3.</b> รหัสแร็ค — “RT01 ใช้กับรถอะไรได้บ้าง”<br>'+
      '<b>4.</b> ประเภท/งบ — “แร็คไฟฟ้าไม่เกิน 2800”<br>'+
      '<b>5.</b> รหัสเครื่อง — “เครื่อง 2KD ใช้แร็คตัวไหน”', chipsAfter:true};

  const p = parse(qRaw);
  if(!hasConstraint(p)) return noResult(p);
  const rows = search(p);

  if(!rows.length) return noResult(p);

  const codes = groupCodes(rows);
  const hits = new Set(rows.map(function(r){return r.i}));
  // ทุกชิ้นที่มาจากสิ่งที่ผู้ใช้พิมพ์ ต้อง escape ก่อนต่อเป็น HTML
  const parts = [];
  if(p.brands.length) parts.push(escapeHtml(p.brands.join(' และ ')));
  if(p.terms.length) parts.push(escapeHtml(p.terms.join(' ').toUpperCase()));
  if(p.year !== null) parts.push('ปี ' + p.year);
  if(p.type !== null) parts.push('แร็ค' + TYPES[p.type]);
  if(p.lhd) parts.push('พวงมาลัยซ้าย');
  if(p.cap !== null) parts.push('ไม่เกิน ' + thb(p.cap) + ' บาท');
  if(p.engine) parts.push('เครื่อง ' + escapeHtml(p.engine.toUpperCase()));
  const what = parts.length ? parts.join(' · ') : 'ทั้งตาราง';

  if(p.count){
    const byBrand = {};
    rows.forEach(function(r){byBrand[r.brand] = (byBrand[r.brand]||0)+1});
    const lines = Object.keys(byBrand).sort(function(a,b){return byBrand[b]-byBrand[a]})
      .map(function(b){return '<b>'+b+'</b> '+byBrand[b]+' รายการ'}).join(' · ');
    return {headline:'<b>'+what+'</b> มีทั้งหมด <b>'+rows.length+'</b> รายการ ใน <b>'+codes.length+'</b> รหัสแร็ค',
            hint:lines, table:rows, rowsCount:rows.length};
  }

  if(p.code && codes.length === 1){
    const c = codes[0];
    return {headline:'รหัส <b>'+c.code+'</b> ราคา <b>'+thb(c.price)+' บาท</b> ใช้ร่วมกันได้ '+c.rows.length+' รุ่น',
            cards:[c], hits:hits, rowsCount:c.rows.length};
  }

  if(p.cheap || p.exp){
    const top = codes.slice(0,5);
    const word = p.cheap ? 'ถูกที่สุด' : 'แพงที่สุด';
    return {headline:'<b>'+what+'</b> ที่'+word+' คือ <b>'+top[0].code+'</b> ราคา <b>'+thb(top[0].price)+' บาท</b>',
            cards:top, hits:hits, table:rows.length > 12 ? null : rows, rowsCount:rows.length,
            hint:'เรียงจาก'+word+'ลงมา '+top.length+' อันดับแรก จากทั้งหมด '+rows.length+' รายการที่เข้าเงื่อนไข'};
  }

  const priceSet = Array.from(new Set(codes.map(function(c){return c.price})));
  let head;
  if(codes.length === 1){
    head = '<b>'+what+'</b> ใช้แร็ครหัส <b>'+codes[0].code+'</b> ราคา <b>'+thb(codes[0].price)+' บาท</b>';
  } else if(priceSet.length === 1){
    head = '<b>'+what+'</b> เจอ '+rows.length+' รายการ ราคาเดียวกันหมดที่ <b>'+thb(priceSet[0])+' บาท</b>';
  } else {
    const mn = Math.min.apply(null,priceSet), mx = Math.max.apply(null,priceSet);
    head = '<b>'+what+'</b> เจอ '+rows.length+' รายการ ใน '+codes.length+' รหัสแร็ค ราคา <b>'+thb(mn)+'–'+thb(mx)+' บาท</b>';
  }
  const showCards = codes.slice(0,6);
  return {headline:head, cards:showCards, hits:hits, rowsCount:rows.length,
          table:codes.length > 6 ? rows : null,
          hint:codes.length > 6 ? 'แสดงการ์ด 6 รหัสแรก ที่เหลืออยู่ในตารางด้านล่าง' : ''};
}

function noResult(p){
  const guess = [];
  if(p.terms.length){
    const t = p.terms[0];
    const hit = {};
    ROWS.forEach(function(r){ if(near(r.hay, t.slice(0, Math.max(3, t.length-1)))) hit[r.model] = 1; });
    Object.keys(hit).slice(0,6).forEach(function(m){guess.push(m)});
  }
  let hint = 'ลองพิมพ์เฉพาะชื่อรุ่นสั้น ๆ เช่น <b>vigo</b>, <b>altis</b>, <b>d-max</b> หรือใส่รหัสแร็คอย่าง <b>RT01</b>';
  if(guess.length){
    hint = 'ใกล้เคียงที่มีในตาราง: ' + guess.map(function(g){return '<b>'+g+'</b>'}).join(' · ');
  } else if(p.unknown.length){
    hint = 'ยังไม่รู้จักคำว่า “<b>'+escapeHtml(p.unknown.join(' '))+'</b>” ลองพิมพ์ชื่อรุ่นเป็นภาษาอังกฤษ เช่น <b>vigo</b>, <b>d-max</b>, <b>triton</b> หรือใส่รหัสแร็คอย่าง <b>RT01</b>';
  }
  return {headline:'ยังไม่เจอรายการที่ตรงกับ “'+escapeHtml(p.raw.trim())+'” ในตารางครับ', hint:hint, chipsAfter:true};
}

/* ---------------- rendering ---------------- */
const thread = document.getElementById('thread');
const scroll = document.getElementById('scroll');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function el(html){
  const d = document.createElement('div');
  d.innerHTML = html.trim();
  return d.firstElementChild;
}
function toBottom(){ scroll.scrollTop = scroll.scrollHeight; }

const EXAMPLES = ['แร็ค vigo ราคาเท่าไหร่','altis 2010','RT01 ใช้กับรถอะไรได้บ้าง',
                  'แร็คไฟฟ้าไม่เกิน 2800','เครื่อง 2KD ใช้แร็คตัวไหน','อีซูซุมีกี่รายการ',
                  'ดีแม็ก 4wd','แร็คโตโยต้าถูกสุด','พวงมาลัยซ้ายมีอะไรบ้าง'];

// ผูก handler ที่ปุ่มโดยตรง ไม่พึ่ง event delegation เพราะบางโฮสต์ดัก click ที่ document
function wireChips(root){
  root.querySelectorAll('[data-q]').forEach(function(b){
    b.addEventListener('click', function(){ ask(b.getAttribute('data-q')); });
  });
}
function chipsHtml(list){
  return '<div class="chips">' + list.map(function(t){
    return '<button class="chip" type="button" data-q="'+escapeHtml(t)+'">'+escapeHtml(t)+'</button>';
  }).join('') + '</div>';
}

function cardHtml(c, hits){
  const tag = c.typeIdx === 1
    ? '<span class="tag eps">ไฟฟ้ากระบอกแห้ง</span>'
    : '<span class="tag oil">น้ำมัน</span>';
  const lhd = c.lhd ? '<span class="tag lhd">พวงมาลัยซ้าย</span>' : '';
  const cap = c.rows.length > 1
    ? '<p class="fitcap">รุ่นที่ใช้แร็ครหัสนี้ร่วมกันได้</p>' : '';
  const fits = c.rows.map(function(r){
    const on = hits && hits.has(r.i) ? ' class="hit"' : '';
    return '<li'+on+'><span class="b">'+escapeHtml(r.brand)+'</span>'+
           '<span class="m">'+escapeHtml(r.model.replace(/\s*\*พวงมาลัยซ้าย\*/,''))+'</span>'+
           '<span class="y">'+escapeHtml(r.year)+'</span>'+
           '<span class="e">เครื่อง '+escapeHtml(r.engine)+'</span></li>';
  }).join('');
  return '<article class="card">'+
    '<div class="card-top"><span class="code">'+escapeHtml(c.code)+'</span>'+tag+lhd+
    '<span class="price">'+thb(c.price)+'<span>บาท</span></span></div>'+
    cap+'<ul class="fits">'+fits+'</ul></article>';
}

const TABLE_MAX = 60;
function tableHtml(rows){
  const more = rows.length > TABLE_MAX
    ? '<p class="hint">ตารางแสดง '+TABLE_MAX+' แถวแรกจากทั้งหมด '+rows.length+
      ' แถว ถ้าอยากดูครบให้ถามให้แคบลง เช่น ใส่ยี่ห้อหรือปีเพิ่ม</p>' : '';
  const body = rows.slice(0,TABLE_MAX).map(function(r){
    return '<tr><td class="code-cell">'+escapeHtml(r.code)+'</td><td>'+escapeHtml(r.brand)+'</td>'+
      '<td>'+escapeHtml(r.model.replace(/\s*\*พวงมาลัยซ้าย\*/,''))+'</td><td>'+escapeHtml(r.year)+'</td>'+
      '<td>'+escapeHtml(r.engine)+'</td><td>'+escapeHtml(r.type)+'</td>'+
      '<td class="num">'+thb(r.price)+'</td></tr>';
  }).join('');
  return more + '<div class="tablewrap"><table><thead><tr><th>รหัส</th><th>ยี่ห้อ</th><th>รุ่น</th>'+
    '<th>ปี</th><th>เครื่อง</th><th>ประเภท</th><th>ราคา</th></tr></thead><tbody>'+body+
    '</tbody></table></div>';
}

function plainText(a){
  let t = a.headline.replace(/<[^>]+>/g,'');
  if(a.cards) a.cards.forEach(function(c){
    t += '\n\n[' + c.code + '] ' + thb(c.price) + ' บาท · ' + c.type + (c.lhd ? ' · พวงมาลัยซ้าย' : '');
    c.rows.forEach(function(r){
      t += '\n  - ' + r.brand + ' ' + r.model.replace(/\s*\*พวงมาลัยซ้าย\*/,'') + ' ' + r.year + ' (เครื่อง ' + r.engine + ')';
    });
  });
  return t;
}

function addBot(a){
  const bubble = el('<div class="row"><img class="avatar" alt=""><div class="bubble"></div></div>');
  bubble.querySelector('.avatar').src = LOGO;
  const box = bubble.querySelector('.bubble');
  let html = '<p class="headline">'+a.headline+'</p>';
  if(a.cards) html += '<div class="cards">'+a.cards.map(function(c){
    return cardHtml(c, a.hits);
  }).join('')+'</div>';
  if(a.hint) html += '<p class="hint">'+a.hint+'</p>';
  if(a.table) html += tableHtml(a.table);
  if(a.chipsAfter) html += '<div class="cards">'+chipsHtml(EXAMPLES.slice(2,7))+'</div>';
  if(a.cards || a.table){
    html += '<div class="foot"><span class="srcnote">อ้างอิงตารางราคาแร็คพวงมาลัย '+
      (a.rowsCount || 0)+' รายการที่ตรงเงื่อนไข</span>'+
      '<button class="linkbtn" type="button" data-copy="1">คัดลอกคำตอบ</button></div>';
  }
  box.innerHTML = html;
  if(a.cards || a.table){
    box.querySelector('[data-copy]').addEventListener('click', function(e){
      copy(plainText(a), e.currentTarget);
    });
  }
  wireChips(box);
  thread.appendChild(bubble);
  toBottom();
}

function copy(text, btn){
  const done = function(ok){
    btn.textContent = ok ? 'คัดลอกแล้ว' : 'กด Ctrl+C เพื่อคัดลอก';
    setTimeout(function(){btn.textContent = 'คัดลอกคำตอบ'}, 2200);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ legacy(); });
    return;
  }
  legacy();
  function legacy(){
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    done(ok);
  }catch(err){ done(false); }
  }
}

let busy = false;
function ask(text){
  const t = text.trim();
  if(!t || busy) return;
  if(thread.querySelector('.welcome')) thread.innerHTML = '';
  addUser(t);
  qHistory.unshift(t); histPos = -1;
  busy = true; sendBtn.disabled = true;
  const wait = el('<div class="row"><img class="avatar" alt=""><div class="bubble"><div class="dots"><i></i><i></i><i></i></div></div></div>');
  wait.querySelector('.avatar').src = LOGO;
  thread.appendChild(wait); toBottom();
  setTimeout(function(){
    wait.remove();
    try{
      addBot(answer(t));
    }catch(err){
      addBot({headline:'ขออภัยครับ ระบบอ่านคำถามนี้ไม่ผ่าน ลองพิมพ์ใหม่สั้น ๆ เช่น <b>vigo</b> หรือ <b>RT01</b>'});
      if(window.console) console.error('[rack-bot]', err);
    }finally{
      // ต้องปลดล็อกเสมอ ไม่งั้นถามต่อไม่ได้อีกเลย
      busy = false; sendBtn.disabled = false;
      input.focus();
    }
  }, 260);
}

/* ---------------- wiring ---------------- */
const qHistory = [];
let histPos = -1;

const quickRow = document.getElementById('quick');
quickRow.innerHTML = EXAMPLES.slice(0,6).map(function(t){
  return '<button class="chip" type="button" data-q="'+escapeHtml(t)+'">'+escapeHtml(t)+'</button>';
}).join('');
wireChips(quickRow);
sendBtn.addEventListener('click', function(){ const v = input.value; input.value = ''; autosize(); ask(v); });
input.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    const v = input.value; input.value = ''; autosize(); ask(v);
  } else if(e.key === 'ArrowUp' && input.value === '' && qHistory.length){
    histPos = Math.min(histPos+1, qHistory.length-1);
    input.value = qHistory[histPos]; autosize();
  } else if(e.key === 'ArrowDown' && histPos > -1){
    histPos--; input.value = histPos < 0 ? '' : qHistory[histPos]; autosize();
  }
});
function autosize(){
  input.style.height = 'auto';
  const h = input.scrollHeight;
  input.style.height = Math.min(h, 132) + 'px';
  input.style.overflowY = h > 132 ? 'auto' : 'hidden';
}
input.addEventListener('input', autosize);

document.getElementById('resetBtn').addEventListener('click', function(){ welcome(); input.focus(); });
document.getElementById('themeBtn').addEventListener('click', function(){
  const root = document.documentElement;
  const nowDark = root.getAttribute('data-theme') === 'dark' ||
    (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  root.setAttribute('data-theme', nowDark ? 'light' : 'dark');
});

welcome();
input.focus();
</script>
